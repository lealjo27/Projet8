name: CI/CD API Scoring

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Tests automatisés
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter les tests
        run: python -m pytest -v

  docker:
    name: Construire l'image Docker
    runs-on: ubuntu-latest
    needs: tests

    # Seulement lors d'un push sur main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t projet8-scoring:${{ github.sha }} .

  deploy-render:
    name: Déployer sur Render
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Déclencher le déploiement Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Le secret RENDER_DEPLOY_HOOK_URL est absent."
            exit 1
          fi

          curl \
            --fail \
            --show-error \
            --silent \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

          echo
          echo "Déploiement Render déclenché."
