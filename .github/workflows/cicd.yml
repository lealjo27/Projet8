    deploy-simulated:
      needs: build
      runs-on: ubuntu-latest

      steps:
        - name: Télécharger l'image
          uses: actions/download-artifact@v4
          with:
            name: projet8-api

        - name: Charger l'image
          run: docker load -i projet8-api.tar

        - name: Déployer le conteneur
          run: |
            docker run -d \
              --name projet8-api \
              -p 7860:7860 \
              projet8-api:${{ github.sha }}

        - name: Attendre le démarrage
          run: |
            for i in {1..30}; do
              if curl --fail http://localhost:7860/; then
                exit 0
              fi
              sleep 2
            done
            docker logs projet8-api
            exit 1

        - name: Afficher les conteneurs
          run: docker ps